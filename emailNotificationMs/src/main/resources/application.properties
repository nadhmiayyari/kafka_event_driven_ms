spring.application.name=emailNotificationMs

spring.kafka.consumer.bootstrap-servers=localhost:9092

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
consumer.group-id=product-created-events


##trusted packages for deserialization when processing json messages
spring.kafka.consumer.properties.spring.json.trusted.packages=com.app.core

spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled = true